<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 160" role="img" aria-labelledby="title desc"><title id="title">长序列分块</title><desc id="desc">重叠的图像片段用于连接局部结果，重访约束可以跨越多个片段。</desc><style>text{font:15px "Microsoft YaHei",sans-serif;fill:#233d35}.ray,.alt,.grid,.guide,.link{fill:none;stroke-linecap:round;stroke-linejoin:round}.ray{stroke:#08715d;stroke-width:2.3}.alt{stroke:#a54919;stroke-width:2.5;stroke-dasharray:5 4}.grid,.box{stroke:#91aaa0;stroke-width:1.3}.guide{stroke:#8eaaa0;stroke-width:1.2;stroke-dasharray:3 3}.link{stroke:#3157a0;stroke-width:3}.box{fill:#edf3eb}.point,.cam{fill:#08715d}.bad{fill:#a54919}</style><rect x="14" y="59" width="108" height="36" rx="5" class="box"/><rect x="97" y="72" width="106" height="36" rx="5" class="box"/><rect x="179" y="85" width="115" height="36" rx="5" class="box"/><path d="M39 56Q141 -10 264 80" class="alt"/><circle cx="39" cy="56" r="4" class="bad"/><circle cx="264" cy="80" r="4" class="bad"/><text x="103" y="26">跨片段回访</text><text x="38" y="83">片段 A</text><text x="118" y="97">片段 B</text><text x="210" y="110">片段 C</text><text x="75" y="149">重叠帧连接局部坐标系</text></svg>
